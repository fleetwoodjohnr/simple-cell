appId: app.simplecell.desktop
productName: Simple Cell
copyright: Copyright © Simple Cell contributors
icon: resources/icon.png
# Updates: the app reads its releases from here (electron-updater); CI builds with --publish never and the tag job uploads.
publish:
  provider: github
  owner: fleetwoodjohnr
  repo: simple-cell
  releaseType: release
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
fileAssociations:
  - ext: xlsx
    name: Excel Workbook
    role: Editor
  - ext: xlsm
    name: Excel Macro-Enabled Workbook
    role: Editor
  - ext: xltx
    name: Excel Template
    role: Editor
  - ext: ods
    name: OpenDocument Spreadsheet
    role: Editor
  - ext: csv
    name: CSV
    role: Editor
  - ext: tsv
    name: Tab-separated values
    role: Editor
  - ext: xls
    name: Excel 97-2003 Workbook
    role: Viewer
linux:
  # deb and rpm take the maintainer and homepage from package.json; rpm also needs rpmbuild
  target: [AppImage, deb, rpm]
  syncDesktopName: true
  # one PNG per size: the hicolor theme has no 1024x1024 directory, so a lone 1024 px icon is never found
  icon: resources/icons
  category: Office
  mimeTypes:
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - application/vnd.ms-excel.sheet.macroEnabled.12
    - application/vnd.openxmlformats-officedocument.spreadsheetml.template
    - application/vnd.oasis.opendocument.spreadsheet
    - text/csv
    - text/tab-separated-values
    - application/vnd.ms-excel
deb:
  # electron-builder's default list plus ALSA and GBM, which Electron links against (absent on minimal installs)
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, libgbm1, "libasound2t64 | libasound2"]
rpm:
  depends: [gtk3, libnotify, nss, libXScrnSaver, "(libXtst or libXtst6)", xdg-utils, at-spi2-core, "(libuuid or libuuid1)", alsa-lib, mesa-libgbm, libsecret]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: resources/icon-mac.png
  category: public.app-category.productivity
  # Unsigned: Apple Silicon only runs signed code, so sign ad hoc. With a Developer ID certificate, remove both lines.
  identity: "-"
  hardenedRuntime: false
