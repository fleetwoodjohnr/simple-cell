# Build and test on Linux, Windows and macOS, then install the deb and rpm into clean Ubuntu and Fedora containers.
# Tags (v*) and manual rebuilds also draft a GitHub release with installers and the latest*.yml files the updater reads
# (it only sees the release once the draft is published).
# Builds are unsigned (see docs/BUILD_AND_RELEASE.md): macOS gets an ad-hoc signature so Apple Silicon will run it.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to rebuild as a release draft (blank runs ordinary CI)'
        required: false
        type: string

# A newer push to the same branch cancels the run in progress; tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: ${{ inputs.tag == '' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  prepare:
    name: Validate source and release tag
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve the commit and validate its version
        id: source
        run: node scripts/release.ts prepare
        env:
          RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

  build:
    name: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            builder-args: --linux --x64
          - os: windows-latest
            builder-args: --win --x64
          - os: macos-latest
            builder-args: --mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # LibreOffice Calc is the independent reader/calculator for the formula cross-check and file round trips; poppler checks exported PDFs.
      - name: Test tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb poppler-utils libreoffice-calc rpm
      - name: Test tools (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Test tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-poppler
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: End-to-end tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npx playwright test; else npx playwright test; fi

      - name: Installers
        run: npx electron-builder ${{ matrix.builder-args }} --publish never

      - name: End-to-end tests against the packaged app
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) SC_PACKAGED="$PWD/release/linux-unpacked/simple-cell" xvfb-run -a npx playwright test ;;
            Windows) SC_PACKAGED="$PWD/release/win-unpacked/Simple Cell.exe" npx playwright test ;;
            macOS) SC_PACKAGED="$PWD/release/mac-arm64/Simple Cell.app/Contents/MacOS/Simple Cell" npx playwright test ;;
          esac

      - name: Validate platform downloads and update feed
        run: node scripts/release.ts verify release

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ runner.os }}
          path: test-results/

  # The deb and rpm declare their dependencies by hand (electron-builder.yml): every library must resolve on a clean install.
  linux-install:
    name: install on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            install: apt-get update -qq && apt-get install -y -qq ./dist/*.deb
          - image: ubuntu:24.04
            install: apt-get update -qq && apt-get install -y -qq ./dist/*.deb
          - image: ubuntu:26.04
            install: apt-get update -qq && apt-get install -y -qq ./dist/*.deb
          - image: fedora:44
            install: dnf install -y -q ./dist/*.rpm /usr/bin/ldd
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installers-Linux
          path: dist
      - run: ${{ matrix.install }}
      - name: Every shared library resolves
        run: |
          ldd "/opt/Simple Cell/simple-cell" > ldd.txt
          ! grep "not found" ldd.txt

  release:
    if: needs.prepare.outputs.tag != ''
    needs: [prepare, build, linux-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Only the manifest parser is used here; do not download Electron again.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: installers-*
          merge-multiple: true
      - name: Validate all downloads and create or refresh the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/release.ts draft dist
