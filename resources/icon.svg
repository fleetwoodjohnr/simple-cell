<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source of the app icon. Regenerate the PNGs with `npm run icons`. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fbf86"/>
      <stop offset=".5" stop-color="#1f8a5b"/>
      <stop offset="1" stop-color="#0f4d33"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e6f5ee"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fae74"/>
      <stop offset="1" stop-color="#16744b"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-20%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="30" result="b"/>
      <feOffset in="b" dy="36" result="o"/>
      <feFlood flood-color="#06281a" flood-opacity=".5"/>
      <feComposite in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- tile, top sheen, faint inner edge -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sheen)"/>
  <rect x="65" y="65" width="894" height="894" rx="199" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
  <!-- a sheet of cells with the active cell highlighted -->
  <rect x="236" y="250" width="552" height="524" rx="48" fill="url(#paper)" filter="url(#lift)"/>
  <path d="M236 424H788M236 600H788M420 250V774M604 250V774" stroke="#b9e3cf" stroke-width="14"/>
  <rect x="420" y="424" width="184" height="176" fill="url(#cell)"/>
  <rect x="420" y="424" width="184" height="176" fill="none" stroke="#0f4d33" stroke-width="10"/>
</svg>
