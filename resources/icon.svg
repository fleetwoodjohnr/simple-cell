<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source of the app icon. Regenerate the PNGs with `npm run icons`. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fbf86"/>
      <stop offset=".5" stop-color="#1f8a5b"/>
      <stop offset="1" stop-color="#0f4d33"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#eef8f3"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34b87c"/>
      <stop offset="1" stop-color="#1a7d51"/>
    </linearGradient>
    <clipPath id="sheet"><rect x="224" y="232" width="576" height="560" rx="52"/></clipPath>
    <filter id="lift" x="-25%" y="-20%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="30" result="b"/>
      <feOffset in="b" dy="36" result="o"/>
      <feFlood flood-color="#06281a" flood-opacity=".5"/>
      <feComposite in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- tile, top sheen, faint inner edge -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sheen)"/>
  <rect x="65" y="65" width="894" height="894" rx="199" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
  <!-- a sheet with column and row headings, a grid, and the active cell with its fill handle -->
  <rect x="224" y="232" width="576" height="560" rx="52" fill="url(#paper)" filter="url(#lift)"/>
  <g clip-path="url(#sheet)">
    <path d="M224 232H800V336H224ZM224 336H320V792H224Z" fill="#c4e9d6"/>
    <path d="M480 232H640V336H480ZM224 488H320V640H224Z" fill="#8ccfae"/>
    <path d="M224 336H800M224 488H800M224 640H800M320 232V792M480 232V792M640 232V792" stroke="#a6d9c0" stroke-width="12"/>
  </g>
  <rect x="480" y="488" width="160" height="152" fill="url(#cell)"/>
  <rect x="480" y="488" width="160" height="152" fill="none" stroke="#0f4d33" stroke-width="16"/>
  <rect x="610" y="610" width="60" height="60" fill="#0f4d33" stroke="#fff" stroke-width="12"/>
</svg>
